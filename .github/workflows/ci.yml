name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: Instalar Godot
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m755 "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
      - name: Verificar projeto, lint e testes
        run: ./tools/check.sh
